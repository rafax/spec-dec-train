[project]
name = "specdec"
version = "0.1.0"
description = "Speculative decoding benchmarks and DSpark drafter distillation for Inkling 2 Mini on Apple Silicon (MLX)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "mlx==0.32.4",
    "mlx-vlm==0.8.1",
    "datasets>=4.0.0",
    "numpy",
    "safetensors",
    "huggingface_hub",
    "pyyaml",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/specdec"]

[tool.ruff]
line-length = 100
